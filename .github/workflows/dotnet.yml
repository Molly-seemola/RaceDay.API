name: .NET Build and Test

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build and Test API
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup .NET
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 3. Find the solution file automatically
      - name: Find solution file
        id: find-sln
        run: |
          SLN_PATH=$(find . -name "*.sln" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$SLN_PATH" ]; then
            echo "❌ No .sln file found in repository!"
            exit 1
          fi
          echo "Found solution: $SLN_PATH"
          echo "sln_path=$SLN_PATH" >> $GITHUB_OUTPUT
          echo "sln_dir=$(dirname $SLN_PATH)" >> $GITHUB_OUTPUT

      # 4. Restore
      - name: Restore dependencies
        run: dotnet restore "${{ steps.find-sln.outputs.sln_path }}"

      # 5. Build
      - name: Build solution
        run: dotnet build "${{ steps.find-sln.outputs.sln_path }}" --no-restore --configuration Release

      # 6. Test
      - name: Run unit tests
        run: dotnet test "${{ steps.find-sln.outputs.sln_path }}" --no-build --configuration Release --verbosity normal

      # 7. Success
      - name: Success message
        run: echo "✅ Build and tests completed successfully!"
